name: Deploy mujoco-viewer

on:
  push:
    branches: [main]
    paths:
      - 'mujoco-viewer/**'
      - '.github/workflows/deploy-mujoco-viewer.yml'
  workflow_dispatch:   # allow manual trigger

permissions:
  contents: write   # needed to push to gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mujoco-viewer/package-lock.json

      - name: Install dependencies
        working-directory: mujoco-viewer
        run: npm ci

      - name: Build
        working-directory: mujoco-viewer
        run: npm run build

      # Deploy dist/ into the mujoco-viewer/ subdirectory of gh-pages.
      # keep_files: true preserves any other experiments already on the branch.
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: mujoco-viewer/dist
          destination_dir: mujoco-viewer
          keep_files: true
          # Prevent Jekyll from reprocessing WASM/assets
          enable_jekyll: false

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'mujoco-viewer/**'
      - 'experiments/physics-sim/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build mujoco-viewer
        working-directory: mujoco-viewer
        run: npm install && npm run build

      - name: Build physics-sim
        working-directory: experiments/physics-sim
        run: npm install && npm run build

      - name: Assemble site
        run: |
          mkdir -p staging/mujoco-viewer staging/experiments/physics-sim
          cp index.html staging/
          cp -r mujoco-viewer/dist/. staging/mujoco-viewer/
          cp -r experiments/physics-sim/dist/. staging/experiments/physics-sim/

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: staging
          enable_jekyll: false

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'mujoco-viewer/**'
      - 'experiments/physics-sim/**'
      - 'godot-app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build mujoco-viewer
        working-directory: mujoco-viewer
        run: npm install && npm run build

      - name: Build physics-sim
        working-directory: experiments/physics-sim
        run: npm install && npm run build

      - name: Setup Godot
        run: |
          GODOT_VERSION=4.3-stable
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          mv "/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz" -O /tmp/templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Export Godot app
        run: |
          mkdir -p godot-app/export
          godot --headless --path godot-app --export-release "Web" export/index.html

      - name: Assemble site
        run: |
          mkdir -p staging/mujoco-viewer staging/experiments/physics-sim staging/godot-app
          cp index.html staging/
          cp -r mujoco-viewer/dist/. staging/mujoco-viewer/
          cp -r experiments/physics-sim/dist/. staging/experiments/physics-sim/
          cp -r godot-app/export/. staging/godot-app/
          cp mujoco-viewer/public/coi-serviceworker.js staging/godot-app/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: staging

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
